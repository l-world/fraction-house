name: CI

on:
    push:

jobs:
    build:
        runs-on: ubuntu-latest

        defaults:
            run:
                working-directory: ./fraction-house

        steps:
            - uses: actions/checkout@v4

            - uses: pnpm/action-setup@v4
              with:
                  version: 9

            - uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: pnpm
                  cache-dependency-path: fraction-house/pnpm-lock.yaml

            - run: pnpm install

            - run: pnpm run build
